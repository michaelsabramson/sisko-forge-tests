name: recover-results
# Re-tally a finished run whose save failed: its games are still stored as that run's artifacts (kept 7 days).
on:
  workflow_dispatch:
    inputs:
      run_id: { description: 'swap-test run id', required: true }
permissions:
  contents: write
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { pattern: out-*, path: out, run-id: '${{ inputs.run_id }}', github-token: '${{ github.token }}' }
      - name: Use that run's request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api repos/${{ github.repository }}/actions/runs/${{ inputs.run_id }} -q .head_sha)
          git show "$sha:tests/request.json" > tests/request.json
          jq -c '{name, mode}' tests/request.json
      - name: Tally and save
        run: |
          git ls-remote origin "refs/stop/${{ inputs.run_id }}" | grep -q . && export STOPPED=1
          python3 scripts/aggregate.py
          scripts/commitresults.sh main
