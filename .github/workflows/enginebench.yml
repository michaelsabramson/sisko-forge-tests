name: engine-bench
# A/B check for local engine speedups: the current engine (FORGE_COMMIT + forge.patch) and a candidate
# (+ bench/candidate.patch) play the same seeded games side by side on every runner, lookahead off.
# Reports how often outcomes match (with a current-vs-current control) and the time difference.
on:
  workflow_dispatch:
    inputs:
      runners: { description: 'runners', default: '16' }
      minutes: { description: 'minutes of games per runner', default: '25' }
      flag3: { description: 'JVM flag tried on process 3', default: '' }
      decks: { description: 'tested decks (space-separated)', default: 'SiskoFinal Ironman NorinB3 Kess' }
      flag1: { description: 'JVM options for process 1 (current engine)', default: '' }
      mode: { description: 'bench (A/B) or profile (slow token-deck games)', default: 'bench' }
      cand_flags: { description: 'JVM options for the candidate engine (process 2)', default: '-Dsisko.breakLoops=true' }
permissions:
  contents: read
concurrency:
  group: enginebench
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.m.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: echo "shards=$(jq -nc "[range(0; ${{ inputs.runners }})]")" >> $GITHUB_OUTPUT
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('FORGE_COMMIT') }}
          restore-keys: maven-
      - name: Fetch Forge at pinned commit
        run: |
          git init forge && cd forge
          git remote add origin https://github.com/Card-Forge/forge
          GIT_LFS_SKIP_SMUDGE=1 git fetch --depth 1 origin $(cat ../FORGE_COMMIT)
          git -c advice.detachedHead=false checkout FETCH_HEAD
          git apply ../forge.patch
      - name: Build current engine
        run: |
          cd forge
          mvn -B -q -Dmaven.wagon.http.retryHandler.count=3 -pl forge-ai -am package dependency:copy-dependencies -DoutputDirectory=$GITHUB_WORKSPACE/lib-base -DincludeScope=runtime -DskipTests -Dcheckstyle.skip=true -Dmaven.javadoc.skip=true
          rm -f ../lib-base/forge-core-*.jar ../lib-base/forge-game-*.jar ../lib-base/forge-ai-*.jar
          cp forge-core/target/forge-core-*.jar forge-game/target/forge-game-*.jar forge-ai/target/forge-ai-*.jar ../lib-base/
      - name: Build candidate engine
        run: |
          cd forge
          [ -s ../bench/candidate.patch ] && git apply ../bench/candidate.patch
          mvn -B -q -o -pl forge-ai -am package -DskipTests -Dcheckstyle.skip=true -Dmaven.javadoc.skip=true
          cp -r ../lib-base ../lib-cand
          rm -f ../lib-cand/forge-core-*.jar ../lib-cand/forge-game-*.jar ../lib-cand/forge-ai-*.jar
          cp forge-core/target/forge-core-*.jar forge-game/target/forge-game-*.jar forge-ai/target/forge-ai-*.jar ../lib-cand/
      - name: Compile runner
        run: mkdir -p runner-classes && javac -nowarn -cp "lib-base/*" -d runner-classes runner/Run.java
      - run: tar czf bench.tgz lib-base lib-cand runner-classes forge/forge-gui/res
      - uses: actions/upload-artifact@v4
        with: { name: bench-build, path: bench.tgz, retention-days: 1 }
  play:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        s: ${{ fromJson(needs.build.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: actions/download-artifact@v4
        with: { name: bench-build }
      - run: tar xzf bench.tgz
      - if: ${{ inputs.mode != 'profile' }}
        run: BENCH_DECKS="${{ inputs.decks }}" FLAG1="${{ inputs.flag1 }}" CAND_FLAGS="${{ inputs.cand_flags }}" bench/run.sh ${{ matrix.s }} ${{ inputs.minutes }} "${{ inputs.flag3 }}"
      - if: ${{ inputs.mode == 'profile' }}
        run: bench/profile.sh ${{ matrix.s }} ${{ inputs.minutes }}
      - uses: actions/upload-artifact@v4
        with:
          name: bench-out-${{ matrix.s }}
          path: out/
          retention-days: 3
  compare:
    needs: play
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: bench-out-*, path: out }
      - if: ${{ inputs.mode != 'profile' }}
        run: python3 bench/compare.py | tee -a $GITHUB_STEP_SUMMARY
      - if: ${{ inputs.mode == 'profile' }}
        run: |
          python3 bench/slowstacks.py | tee -a $GITHUB_STEP_SUMMARY
          echo "== board summaries of slow games"; grep -h "^SLOW" out/*/g*_*.log | sort -t= -k2 -n -r | head -80
          for f in out/*/profile_*.txt; do echo "== $f"; head -60 "$f"; done
          cat out/*/g*_*.log | grep '^G' | awk '{for(i=1;i<=NF;i++) if($i ~ /ms$/){sub("ms","",$i); print $i}}' | sort -n | awk '{a[NR]=$1} END {c=0; for(i in a) if(a[i]>=899000) c++; print "games", NR, "median", a[int(NR/2)]/1000 "s", "p95", a[int(NR*.95)]/1000 "s", "15-minute cut-offs", c}' 
