name: dispatcher
# Starts the next queued test (queue/*.json) whenever no swap-test run is active.
on:
  push:
    paths: ['queue/**']
  workflow_dispatch: {}
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: dispatcher
  cancel-in-progress: false
jobs:
  next:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Is a test already running?
        id: busy
        run: |
          n=$(gh run list -R ${{ github.repository }} -w swaptest.yml -L 20 --json status -q '[.[]|select(.status!="completed")]|length')
          echo "active=$n" >> $GITHUB_OUTPUT; echo "active swap-test runs: $n"
      - name: Refresh the early read of a running audit
        if: steps.busy.outputs.active != '0' && github.event_name == 'schedule'
        run: |
          id=$(gh run list -R ${{ github.repository }} -w swaptest.yml -L 5 --json databaseId,status,startedAt -q '[.[]|select(.status=="in_progress")][0].databaseId')
          [ -z "$id" ] && exit 0
          started=$(gh run view $id -R ${{ github.repository }} --json startedAt -q .startedAt)
          sha=$(gh api repos/${{ github.repository }}/actions/runs/$id -q .head_sha)
          req=$(gh api "repos/${{ github.repository }}/contents/tests/request.json?ref=$sha" -H "Accept: application/vnd.github.raw")
          mode=$(echo "$req" | jq -r .mode); mins=$(echo "$req" | jq -r '.minutes // 160')
          age=$(( ( $(date +%s) - $(date -d "$started" +%s) ) / 60 ))
          echo "run $id mode=$mode age=${age}m planned=${mins}m"
          # audits only; skip the first ~30 min (too few games) and the last stretch (the final result is close)
          if [ "$mode" = "audit" ] && [ $age -ge 30 ] && [ $age -le $((mins + 5)) ]; then
            gh workflow run peek.yml -R ${{ github.repository }} --ref ${{ github.ref_name }} -f run_id=$id
          fi
      - name: Start next queued test
        if: steps.busy.outputs.active == '0'
        run: |
          name=$(python3 scripts/dispatch.py)
          if [ -z "$name" ]; then echo "queue empty"; exit 0; fi
          git config user.name "swaptest-bot"; git config user.email "actions@users.noreply.github.com"
          if [ "$(jq -r .allcached tests/request.json)" = "true" ]; then
            # every version already has enough games from earlier runs: report straight from the cache
            mkdir -p out && python3 scripts/aggregate.py
            git add -A decks queue tests results
            git commit -m "Results: $name"
            git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }}
            gh workflow run dispatcher.yml -R ${{ github.repository }} --ref ${{ github.ref_name }}
            exit 0
          fi
          git add -A decks queue tests
          git commit -m "Start queued test: $name"
          git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }}
          gh workflow run swaptest.yml -R ${{ github.repository }} --ref ${{ github.ref_name }}
