name: backfill-lands
# Adds the land curve to a Rank that finished before Ranks recorded it, from that run's stored game logs (kept 7 days).
on:
  workflow_dispatch:
    inputs:
      run_id: { description: 'swap-test run id of the Rank', required: true }
      result: { description: 'result file, e.g. results/ranking_of_norinb3.md', required: true }
permissions:
  contents: write
  actions: read
jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: out-*, path: out, run-id: '${{ inputs.run_id }}', github-token: '${{ github.token }}' }
      - run: python3 scripts/backfill_lands.py "${{ inputs.result }}"
      - name: Save
        run: |
          git config user.name "swaptest-bot"; git config user.email "actions@users.noreply.github.com"
          git add "${{ inputs.result }}" && git commit -qm "Land curve backfilled: ${{ inputs.result }}" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
