name: swap-test
on:
  push:
    paths: ['tests/request.json']
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write
concurrency:
  group: swaptest
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.m.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: echo "shards=$(jq -c '[range(0; (.shards // 20))]' tests/request.json)" >> $GITHUB_OUTPUT
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Fetch Forge at pinned commit
        run: |
          git init forge && cd forge
          git remote add origin https://github.com/Card-Forge/forge
          GIT_LFS_SKIP_SMUDGE=1 git fetch --depth 1 origin $(cat ../FORGE_COMMIT)
          git -c advice.detachedHead=false checkout FETCH_HEAD
          git apply ../forge.patch
      - name: Build engine (core, game, ai)
        run: |
          cd forge
          mvn -B -pl forge-ai -am package dependency:copy-dependencies -DoutputDirectory=$GITHUB_WORKSPACE/lib -DincludeScope=runtime -DskipTests -Dcheckstyle.skip=true -Dmaven.javadoc.skip=true > ../build.log 2>&1
          rm -f ../lib/forge-core-*.jar ../lib/forge-game-*.jar ../lib/forge-ai-*.jar
          cp forge-core/target/forge-core-*.jar forge-game/target/forge-game-*.jar forge-ai/target/forge-ai-*.jar ../lib/
          ls ../lib | head -50 >> ../build.log
      - name: Report build failure
        if: failure()
        run: |
          mkdir -p results && grep -E "ERROR|BUILD|error:" build.log | head -80 > results/build-error.log || tail -100 build.log > results/build-error.log
          git config user.name "swaptest-bot"; git config user.email "actions@users.noreply.github.com"
          git add results/build-error.log && git commit -m "Build error log" && git push origin HEAD:${{ github.ref_name }}
      - name: Compile runner
        run: |
          mkdir -p runner-classes
          javac -nowarn -cp "lib/*" -d runner-classes runner/Run.java
      - name: Package
        run: tar czf build.tgz lib runner-classes forge/forge-gui/res
      - uses: actions/upload-artifact@v4
        with: { name: build, path: build.tgz, retention-days: 2 }
  shard:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        s: ${{ fromJson(needs.build.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/download-artifact@v4
        with: { name: build }
      - run: tar xzf build.tgz
      - name: Start games
        run: nohup setsid scripts/shard.sh ${{ matrix.s }} $(jq -r '.minutes // 40' tests/request.json) > shard.out 2>&1 &
      - name: Checkpoint 1
        if: ${{ !cancelled() }}
        run: scripts/waitgames.sh 20
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: out-${{ matrix.s }}
          path: out/
          retention-days: 7
          overwrite: true
      - name: Checkpoint 2
        if: ${{ !cancelled() }}
        run: scripts/waitgames.sh 20
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: out-${{ matrix.s }}
          path: out/
          retention-days: 7
          overwrite: true
      - name: Checkpoint 3
        if: ${{ !cancelled() }}
        run: scripts/waitgames.sh 20
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: out-${{ matrix.s }}
          path: out/
          retention-days: 7
          overwrite: true
      - name: Checkpoint 4
        if: ${{ !cancelled() }}
        run: scripts/waitgames.sh 20
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: out-${{ matrix.s }}
          path: out/
          retention-days: 7
          overwrite: true
      - name: Checkpoint 5
        if: ${{ !cancelled() }}
        run: scripts/waitgames.sh 20
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: out-${{ matrix.s }}
          path: out/
          retention-days: 7
          overwrite: true
      - name: Checkpoint 6
        if: ${{ !cancelled() }}
        run: scripts/waitgames.sh 20
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: out-${{ matrix.s }}
          path: out/
          retention-days: 7
          overwrite: true
      - name: Checkpoint 7
        if: ${{ !cancelled() }}
        run: scripts/waitgames.sh 20
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: out-${{ matrix.s }}
          path: out/
          retention-days: 7
          overwrite: true
      - name: Checkpoint 8
        if: ${{ !cancelled() }}
        run: scripts/waitgames.sh 20
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: out-${{ matrix.s }}
          path: out/
          retention-days: 7
          overwrite: true
      - name: Final
        if: ${{ !cancelled() }}
        run: scripts/waitgames.sh 100000
      - name: Stop games (run cancelled)
        if: ${{ cancelled() }}
        run: pkill -f "Run forge" || true; sleep 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out-${{ matrix.s }}
          path: out/
          retention-days: 7
          overwrite: true
  aggregate:
    needs: shard
    if: ${{ always() && needs.shard.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: out-*, path: out }
      - run: python3 scripts/aggregate.py
      - name: Commit results
        run: |
          git config user.name "swaptest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/ cache/ 2>/dev/null || git add results/
          git commit -m "Results: $(jq -r .name tests/request.json)" || true
          git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }}
      - name: Start the next queued test
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run dispatcher.yml -R ${{ github.repository }} --ref ${{ github.ref_name }} || true
