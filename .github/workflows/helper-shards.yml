name: helper-shards
# Extra runners from the helper organization's account (its own job limit), called by the tiny workflow in
# magic-the-science/sisko-forge-helper. Plays shards first..shards-1 of a main swap-test run: same code (checked out
# from the main repo at the run's commit), same request, batches claimed in the main repo, games saved as this run's
# out-<shard> artifacts, which the main run's early reads and final tally download.
on:
  workflow_call:
    inputs:
      repo: { type: string, required: true }
      run: { type: string, required: true }
      sha: { type: string, required: true }
      first: { type: number, required: true }
    secrets:
      MAIN_TOKEN: { required: true }
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.m.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with: { repository: '${{ inputs.repo }}', ref: '${{ inputs.sha }}', token: '${{ secrets.MAIN_TOKEN }}' }
      - id: m
        run: echo "shards=$(jq -c --argjson a ${{ inputs.first }} '[range($a; (.shards // 38))]' tests/request.json)" >> $GITHUB_OUTPUT
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Fetch Forge at pinned commit
        run: |
          git init forge && cd forge
          git remote add origin https://github.com/Card-Forge/forge
          GIT_LFS_SKIP_SMUDGE=1 git fetch --depth 1 origin $(cat ../FORGE_COMMIT)
          git -c advice.detachedHead=false checkout FETCH_HEAD
          git apply ../forge.patch
      - name: Build engine (core, game, ai)
        run: |
          cd forge
          mvn -B -pl forge-ai -am package dependency:copy-dependencies -DoutputDirectory=$GITHUB_WORKSPACE/lib -DincludeScope=runtime -DskipTests -Dcheckstyle.skip=true -Dmaven.javadoc.skip=true > ../build.log 2>&1
          rm -f ../lib/forge-core-*.jar ../lib/forge-game-*.jar ../lib/forge-ai-*.jar
          cp forge-core/target/forge-core-*.jar forge-game/target/forge-game-*.jar forge-ai/target/forge-ai-*.jar ../lib/
          ls ../lib | head -50 >> ../build.log
      - name: Compile runner
        run: |
          mkdir -p runner-classes
          javac -nowarn -cp "lib/*" -d runner-classes runner/Run.java
      - name: Package
        run: tar czf build.tgz lib runner-classes forge/forge-gui/res
      - uses: actions/upload-artifact@v4
        with: { name: build, path: build.tgz, retention-days: 2 }
  shard:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        s: ${{ fromJson(needs.build.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with: { repository: '${{ inputs.repo }}', ref: '${{ inputs.sha }}', token: '${{ secrets.MAIN_TOKEN }}' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/download-artifact@v4
        with: { name: build }
      - run: tar xzf build.tgz
      - name: Start games
        env:
          GH_TOKEN: ${{ secrets.MAIN_TOKEN }}   # batches are claimed in the main repo (scripts/claimbatch.sh)
          MAIN_REPO: ${{ inputs.repo }}
          MAIN_RUN: ${{ inputs.run }}
          MAIN_SHA: ${{ inputs.sha }}
        run: nohup setsid scripts/shard.sh ${{ matrix.s }} $(jq -r '.minutes // 40' tests/request.json) > shard.out 2>&1 &
      - name: Checkpoint 1
        if: ${{ !cancelled() }}
        run: scripts/waitgames.sh 20
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        continue-on-error: true   # a progress save racing the final save must not fail the run
        with:
          name: out-${{ matrix.s }}
          path: out/
          retention-days: 7
          overwrite: true
      - name: Checkpoint 2
        if: ${{ !cancelled() }}
        run: scripts/waitgames.sh 20
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        continue-on-error: true   # a progress save racing the final save must not fail the run
        with:
          name: out-${{ matrix.s }}
          path: out/
          retention-days: 7
          overwrite: true
      - name: Checkpoint 3
        if: ${{ !cancelled() }}
        run: scripts/waitgames.sh 20
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        continue-on-error: true   # a progress save racing the final save must not fail the run
        with:
          name: out-${{ matrix.s }}
          path: out/
          retention-days: 7
          overwrite: true
      - name: Checkpoint 4
        if: ${{ !cancelled() }}
        run: scripts/waitgames.sh 20
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        continue-on-error: true   # a progress save racing the final save must not fail the run
        with:
          name: out-${{ matrix.s }}
          path: out/
          retention-days: 7
          overwrite: true
      - name: Checkpoint 5
        if: ${{ !cancelled() }}
        run: scripts/waitgames.sh 20
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        continue-on-error: true   # a progress save racing the final save must not fail the run
        with:
          name: out-${{ matrix.s }}
          path: out/
          retention-days: 7
          overwrite: true
      - name: Checkpoint 6
        if: ${{ !cancelled() }}
        run: scripts/waitgames.sh 20
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        continue-on-error: true   # a progress save racing the final save must not fail the run
        with:
          name: out-${{ matrix.s }}
          path: out/
          retention-days: 7
          overwrite: true
      - name: Checkpoint 7
        if: ${{ !cancelled() }}
        run: scripts/waitgames.sh 20
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        continue-on-error: true   # a progress save racing the final save must not fail the run
        with:
          name: out-${{ matrix.s }}
          path: out/
          retention-days: 7
          overwrite: true
      - name: Checkpoint 8
        if: ${{ !cancelled() }}
        run: scripts/waitgames.sh 20
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        continue-on-error: true   # a progress save racing the final save must not fail the run
        with:
          name: out-${{ matrix.s }}
          path: out/
          retention-days: 7
          overwrite: true
      - name: Final
        if: ${{ !cancelled() }}
        run: scripts/waitgames.sh 100000
      - name: Stop games (run cancelled)
        if: ${{ cancelled() }}
        run: pkill -f "Run forge" || true; sleep 3
      - uses: actions/upload-artifact@v4
        id: final_upload
        if: always()
        continue-on-error: true   # GitHub sometimes answers 409 while replacing the previous save; retried below
        with:
          name: out-${{ matrix.s }}
          path: out/
          retention-days: 7
          overwrite: true
      - name: Wait before retrying the final save
        if: ${{ always() && steps.final_upload.outcome == 'failure' }}
        run: sleep 20
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.final_upload.outcome == 'failure' }}
        with:
          name: out-${{ matrix.s }}
          path: out/
          retention-days: 7
          overwrite: true
