name: peek
on:
  workflow_dispatch:
    inputs:
      run_id: { description: 'swap-test run to read', required: true }
permissions:
  contents: write
  actions: read
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: out-*
          path: out
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Use the request that run was started with
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api repos/${{ github.repository }}/actions/runs/${{ inputs.run_id }} -q .head_sha)
          gh api "repos/${{ github.repository }}/contents/tests/request.json?ref=$sha" -H "Accept: application/vnd.github.raw" > tests/request.json
          cat tests/request.json
      - name: Find the helper runners' run
        id: helper
        env:
          GH_TOKEN: ${{ secrets.HELPER_TOKEN }}
        run: scripts/helperrun.sh ${{ inputs.run_id }} >> $GITHUB_OUTPUT
      - uses: actions/download-artifact@v4
        if: ${{ steps.helper.outputs.id != '' }}
        continue-on-error: true
        with:
          pattern: out-*
          path: out
          repository: ${{ steps.helper.outputs.repo }}
          run-id: ${{ steps.helper.outputs.id }}
          github-token: ${{ secrets.HELPER_TOKEN }}
      - run: python3 scripts/aggregate.py
        env:
          PEEK: '1'
      - name: Stop the run if its answer is settled
        if: ${{ hashFiles('stop.flag') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api repos/${{ github.repository }}/actions/runs/${{ inputs.run_id }} -q .head_sha)
          gh api -X POST repos/${{ github.repository }}/git/refs -f ref="refs/stop/${{ inputs.run_id }}" -f sha="$sha" --silent || true
          rm -f stop.flag
      - name: Commit peek
        run: |
          n=$(jq -r .name tests/request.json)
          [ -f results/$n.md ] || { echo "no games yet"; exit 0; }
          mv results/$n.md results/${n}_peek.md
          sed -i "1s/\$/ (early read, run still going)/" results/${n}_peek.md
          git config user.name "swaptest-bot"; git config user.email "actions@users.noreply.github.com"
          git add results/ && git commit -m "Early read: $n" || exit 0
          git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }}
